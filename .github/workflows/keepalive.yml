name: Keep Trustfield awake

# Render free web services sleep after ~15 min without traffic.
# This pings the health endpoint every 10 minutes. Free, no server needed.
# After the first paying customer, move to Render Starter and delete this.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: curl -fsS --max-time 20 https://trustfield.dev/healthz || echo "ping failed"
