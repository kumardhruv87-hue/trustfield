services:
  - type: web
    name: trustfield
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: SHIPPROOF_BASE_URL
        sync: false
      - key: SHIPPROOF_CONTACT_EMAIL
        sync: false
      - key: SHIPPROOF_EMAIL_FROM
        sync: false
      - key: SHIPPROOF_ADMIN_TOKEN
        sync: false
      - key: SHIPPROOF_SECRET_KEY
        sync: false
      - key: SHIPPROOF_PAYMENT_LINK
        sync: false
      - key: SHIPPROOF_DATA
        value: /tmp/data
      - key: PORT
        value: "8000"
